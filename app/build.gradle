plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pcrecomp.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pcrecomp.launcher'
        minSdk 26
        targetSdk 35

        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}
